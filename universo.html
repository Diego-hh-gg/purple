<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<title>El Universo de mi estrella preferida</title>
    
<style>
    body{
    margin:0;
    overflow:hidden;
    background:black;
    font-family:Arial, sans-serif;
}

/* UNIVERSO */


#universo{
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(
            circle at center,
            #120010 0%,
            #080008 40%,
            #000000 100%
        );
}

/* NEBULOSA CENTRAL */

#universo::before{
    content:"";
    position:absolute;
    width:600px;
    height:600px;
    border-radius:50%;
    background:rgba(255,105,217,0.08);
    filter:blur(120px);
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
}

/* VIA LACTEA */

#universo::after{
    content:"";
    position:absolute;
    width:1200px;
    height:250px;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.08),
        rgba(255,105,217,0.12),
        rgba(255,255,255,0.08),
        transparent
    );

    filter:blur(70px);

    transform:rotate(-25deg);

    top:35%;
    left:-10%;
}

/* ESTRELLAS DE FONDO */

.estrella-pequena{
    position:absolute;
    width:1px;
    height:1px;
    background:white;
    border-radius:50%;
    opacity:0.4;
}

/* PARTICULAS ROSAS */

.particula{
    position:absolute;
    width:2px;
    height:2px;
    background:#ff69d9;
    border-radius:50%;
    opacity:0.5;
    animation:flotarParticula 12s linear infinite;
}

@keyframes flotarParticula{

    from{
        transform:translateY(100vh);
    }

    to{
        transform:translateY(-100px);
    }

}

/* ESTRELLAS */

.estrella{
    position:absolute;
    border-radius:50%;
    background:white;
    cursor:pointer;
    opacity:0.95;

    box-shadow:
        0 0 8px white,
        0 0 15px white,
        0 0 25px white;

    transition:.3s;

    animation: titilar 3s infinite;
}

@keyframes titilar{

    0%{
        opacity:0.3;
        transform:scale(1);
    }

    50%{
        opacity:1;
        transform:scale(1.3);
    }

    100%{
        opacity:0.3;
        transform:scale(1);
    }

}

/* ESTRELLAS ESPECIALES */

.estrella.especial{

    background:#ff8bd1;

    opacity:1;

    animation:
        titilar 3s infinite,
        palpitarEspecial 2s infinite;

    box-shadow:
        0 0 10px #ff69d9,
        0 0 20px #ff69d9,
        0 0 30px #ff69d9;
}

.estrella.especial:hover{

    transform:scale(3);

    box-shadow:
        0 0 20px #ff69d9,
        0 0 40px #ff69d9,
        0 0 80px #ff69d9;
}

@keyframes palpitarEspecial{

    0%,100%{

        transform:scale(1);

        box-shadow:
            0 0 10px #ff69d9,
            0 0 20px #ff69d9;
    }

    50%{

        transform:scale(1.8);

        box-shadow:
            0 0 20px #ff69d9,
            0 0 40px #ff69d9,
            0 0 70px #ff69d9;
    }

}

/* ESTRELLA LEGENDARIA */

.estrella-legendaria{

    position:absolute;

    width:20px;
    height:20px;

    border-radius:50%;

    background:#ffd700;

    transform:translate(-50%,-50%);

    cursor:pointer;

    z-index:50;

    animation:
        titilar 2s infinite,
        palpitarLegendaria 1.5s infinite;

    box-shadow:
        0 0 20px #ffd700,
        0 0 40px #ffd700,
        0 0 80px #ffd700,
        0 0 120px #ffd700;
}

@keyframes palpitarLegendaria{

    0%,100%{
        transform:
        translate(-50%,-50%)
        scale(1);
    }

    50%{
        transform:
        translate(-50%,-50%)
        scale(1.5);
    }

}

/* ESTRELLA FUGAZ */

.estrella-fugaz{

    position:absolute;

    height:2px;

    background:
    linear-gradient(
        to right,
        white,
        transparent
    );

    box-shadow:
        0 0 10px white,
        0 0 20px white;

    pointer-events:none;

    animation:
    estrellaFugaz linear forwards;
}

@keyframes estrellaFugaz{

    0%{
        opacity:0;
        transform:
        translate(0,0)
        rotate(-35deg);
    }

    10%{
        opacity:1;
    }

    90%{
        opacity:1;
    }

    100%{
        opacity:0;
        transform:
        translate(-700px,700px)
        rotate(-35deg);
    }

}

/* TITULO */

#tituloUniverso{

    position:absolute;

    top:30px;

    width:100%;

    text-align:center;

    color:white;

    z-index:10;
}

#tituloUniverso h1{

    color:#ff69d9;

    margin-bottom:10px;

    text-shadow:
        0 0 20px #ff69d9,
        0 0 40px #ff69d9;
}

/* CONTADOR */

#contador{

    position:absolute;

    top:20px;
    right:20px;

    color:white;

    background:
    rgba(0,0,0,0.5);

    padding:10px 15px;

    border-radius:15px;

    border:1px solid #ff69d9;

    box-shadow:
    0 0 15px #ff69d9;

    z-index:10;
}

/* POPUP */

#popupMensaje{

    display:none;

    position:fixed;

    top:50%;
    left:50%;

    transform:
    translate(-50%,-50%);

    background:
    rgba(15,15,15,0.95);

    border:2px solid #ff69d9;

    border-radius:20px;

    padding:25px;

    max-width:400px;

    text-align:center;

    color:white;

    box-shadow:
    0 0 30px #ff69d9;

    z-index:999;

    animation:
    aparecer 0.4s ease;
}

#popupMensaje h3{

    color:#ff69d9;

    margin-bottom:15px;
}

#popupMensaje button{

    margin-top:15px;

    padding:10px 20px;

    border:none;

    border-radius:10px;

    background:#ff69d9;

    color:white;

    cursor:pointer;
}

#popupMensaje button:hover{

    box-shadow:
    0 0 20px #ff69d9;
}

@keyframes aparecer{

    from{

        opacity:0;

        transform:
        translate(-50%,-60%);
    }

    to{

        opacity:1;

        transform:
        translate(-50%,-50%);
    }

}
/* TODO TU CSS AQUÍ */
</style>
</head>

    fugaz.classList.add("estrella-fugaz");

    const largo = Math.random() * 120 + 120;
    fugaz.style.width = largo + "px";

                    crearEstrellaLegendaria();

                }
            }

            titulo.innerText = "✨ LA ESTRELLA DE MI CORAZON ✨";

            estrella.dataset.visitada = "true";
            descubiertas++;
            document.getElementById("cantidad").innerText = descubiertas;

/* ESTRELLA LEGENDARIA */

    const legendaria = document.createElement("div");
    legendaria.classList.add("estrella-legendaria");

    legendaria.style.left = "50%";
    legendaria.style.top = "50%";

    legendaria.dataset.mensaje =
        "💖 Tal vez este universo no sea infinito, pero fue creado con mucho cariño para ti. Te quiero mucho mi mulier. 🌌✨";

    legendaria.addEventListener("click", () => {

        document.querySelector("#popupMensaje h3").innerText =
            "👑 Estrella Legendaria 👑";

        document.getElementById("textoMensaje").innerText =
            legendaria.dataset.mensaje;

        document.getElementById("popupMensaje").style.display = "block";
    });

    universo.appendChild(legendaria);
}

/* CERRAR POPUP */
function cerrarMensaje(){
    document.getElementById("popupMensaje").style.display = "none";
}

</script>

</html>
